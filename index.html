function fmtJam(v){const d=new Date(v);if(isNaN(d))return '';const o={timeZone:'Asia/Makassar'};return d.toLocaleDateString('id-ID',{...o,day:'numeric',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('id-ID',{...o,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})+' WITA'}
function usia(s){if(!s)return null;const d=new Date(s+'T00:00:00'),n=new Date();if(isNaN(d))return null;let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()==d.getMonth()&&n.getDate()<d.getDate()))a--;return a>=0?a:null}
const ageTxt=x=>{const a=usia(x.tgl_lahir);return a==null?'':' ('+a+')'};
function fmtD(d){const x=d.split('-');return x[2]+'/'+x[1]}
function fmtR(a,b){const x=a.split('-'),y=b.split('-'),yy=v=>v.slice(2),dd=v=>String(+v);
 if(a==b)return dd(x[2])+'/'+x[1]+'/'+yy(x[0]);
 if(x[0]==y[0]&&x[1]==y[1])return dd(x[2])+' - '+dd(y[2])+'/'+y[1]+'/'+yy(y[0]);
 if(x[0]==y[0])return dd(x[2])+'/'+x[1]+' - '+dd(y[2])+'/'+y[1]+'/'+yy(y[0]);
 return dd(x[2])+'/'+x[1]+'/'+yy(x[0])+' - '+dd(y[2])+'/'+y[1]+'/'+yy(y[0])}
function dt(d,j,end){return new Date(d+'T'+(j?j.slice(0,5)+':00':(end?'23:59:59':'00:00:00')))}
function aktif(t){const n=new Date();return n>=dt(t.tgl_awal,t.jam_awal)&&n<=dt(t.tgl_akhir,t.jam_akhir,1)}
function kind(t){const n=(t.nama||'').toLowerCase();return n.includes('data')?'pendataan':/calon|kandidat/.test(n)?'pencalonan':/ilih|voting|coblos/.test(n)?'pemilihan':/hitung/.test(n)?'penghitungan':/tetap/.test(n)?'penetapan':''}
const UN={pendata:'pendataan',pendataan:'pendataan',pencalonan:'pencalonan',pemilihan:'pemilihan'},TERPILIH_JAM=72;
function tStart(t){return dt(t.tgl_awal,t.jam_awal)}
function tEnd(t){return dt(t.tgl_akhir,t.jam_akhir,1)}
function curKinds(rows){const n=new Date();let r=rows.filter(t=>n>=tStart(t)&&n<=tEnd(t));
 if(!r.length){const st=rows.filter(t=>n>=tStart(t)).sort((a,b)=>tStart(a)-tStart(b));if(st.length)r=[st[st.length-1]]}
 return new Set(r.map(kind).filter(Boolean))}
function entered(rows,k){const n=new Date();return rows.some(t=>kind(t)==k&&n>=tStart(t))}
function openRole(rows,r){const n=new Date();
 if(r=='petugas')return rows.some(t=>kind(t)=='pendataan'&&aktif(t));
 const st=rows.filter(t=>['pendataan','pencalonan','pemilihan'].includes(kind(t)));
 if(!st.some(t=>n>=tStart(t)))return false;
 const ks=rows.filter(t=>['pendataan','pencalonan','pemilihan','penghitungan','penetapan'].includes(kind(t)));
 return n<=new Date(Math.max(...ks.map(t=>tEnd(t).getTime()))+TERPILIH_JAM*36e5)}

let tlq=0;const tlObs=new MutationObserver(()=>{cancelAnimationFrame(tlq);tlq=requestAnimationFrame(tlLayout)});
function tlLayout(){tlObs.disconnect();try{document.querySelectorAll('.tl').forEach(t=>{t.querySelectorAll('svg.tu').forEach(v=>v.remove());const L=[...t.querySelectorAll('li')];L.forEach(l=>l.classList.remove('brk'));if(L.length<2)return;
 const T=t.getBoundingClientRect(),d=[];
 for(let i=0;i<L.length-1;i++){const l=L[i],n=L[i+1];if(n.offsetTop<=l.offsetTop+5)continue;l.classList.add('brk');
  const a=l.getBoundingClientRect(),c=n.getBoundingClientRect(),ba=l.querySelector('b').getBoundingClientRect(),bc=n.querySelector('b').getBoundingClientRect();
  const x1=ba.left+ba.width/2-T.left,y1=ba.top+ba.height/2-T.top,xr=a.right-T.left+6,ym=a.bottom-T.top+9,xl=c.left-T.left-6,x2=bc.left+bc.width/2-T.left,y2=bc.top+bc.height/2-T.top,r=8;
  d.push(`<path d="M${x1} ${y1}H${xr-r}Q${xr} ${y1} ${xr} ${y1+r}V${ym-r}Q${xr} ${ym} ${xr-r} ${ym}H${xl+r}Q${xl} ${ym} ${xl} ${ym+r}V${y2-r}Q${xl} ${y2} ${xl+r} ${y2}H${x2}" fill="none" stroke="${l.dataset.p=='1'?'#4547b5':'#d8daee'}" stroke-width="4" stroke-linecap="round"/>`)}
 if(d.length)t.insertAdjacentHTML('beforeend',`<svg class="tu" width="${T.width}" height="${T.height}" aria-hidden="true">${d.join('')}</svg>`)})}finally{tlObs.observe($('#app'),{childList:true,subtree:true})}}
tlObs.observe($('#app'),{childList:true,subtree:true});addEventListener('resize',tlLayout);addEventListener('load',tlLayout);if(document.fonts)document.fonts.ready.then(tlLayout);
